worker_processes  1;
error_log  /home/cliondev/code/openresty12532/logs/error.log info;
pid        /home/cliondev/code/openresty12532/logs/nginx.pid;

# 必填的events块，解决no "events" section报错
events {
    worker_connections  1024;
}

http {
    default_type  application/octet-stream;
    access_log  /home/cliondev/code/openresty12532/logs/access.log;

    # 全部临时目录改到项目目录，解决权限问题
    client_body_temp_path  /home/cliondev/code/openresty12532/temp/client_body_temp;
    proxy_temp_path        /home/cliondev/code/openresty12532/temp/proxy_temp;
    fastcgi_temp_path      /home/cliondev/code/openresty12532/temp/fastcgi_temp;
    uwsgi_temp_path        /home/cliondev/code/openresty12532/temp/uwsgi_temp;
    scgi_temp_path         /home/cliondev/code/openresty12532/temp/scgi_temp;

    # Lua插件目录 + 开发模式关闭缓存
    lua_package_path "/home/cliondev/code/openresty12532/lua_plugins/?.lua;;";
    lua_code_cache off;

    # ===================== AI-proxy 插件共享内存 =====================
    # 网关 token -> 4家厂商密钥映射表
    lua_shared_dict ai_gateway_token_dict 10m;
    # 文心 AK/SK 换取 access_token 的 TTL 缓存
    lua_shared_dict ai_ernie_token_dict 1m;
    # 路由表覆盖（测试时可指向 mock 地址）
    lua_shared_dict ai_proxy_routes_dict 1m;

    # AI-可观测插件用：counter 累计（不清）+ gauge 窗口聚合 sum/cnt
    lua_shared_dict ai_obs_dict 1m;

    # 提示词模板插件用：构造字面 $ 字符（nginx 变量插值指令无法转义 $，
    # 模板里写 $dollar{key} 运行时即为字面 ${key}，再由 Lua 端渲染替换）
    geo $dollar { default "$"; }

    # 变量化 proxy_pass 需要运行时 DNS 解析
    resolver 223.5.5.5 8.8.8.8 ipv6=off;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       8080;
        server_name  localhost;

        # ===================== AI-提示词模板插件配置 =====================
        # 模板为空 = 插件不生效；server 级配置，全 location 共享且自检接口可读。
        # ⚠ 占位符写法：nginx 的 set 等变量插值指令无法转义 $，直接写 ${key}
        #   会被当作 nginx 变量引用（未定义时 nginx -t 报 invalid variable
        #   name / unknown variable，服务起不来）。必须写成 $dollar{key}：
        #   http{} 已定义 geo $dollar = "$"，运行时插值为字面 ${key}。
        #   也可用 set $prompt_template_file /path/tpl.txt 外置模板（推荐，
        #   文件里可直接写 ${key}，无转义问题）。
        # 配置示例：
        #   set $prompt_template "你是专业客服，租户$dollar{tenant_id}，必须用$dollar{lang}回答。model=$dollar{model}";
        #   set $prompt_var_header_map "tenant_id:X-Tenant-Id,lang:X-Lang";
        set $prompt_template "";
        set $prompt_var_header_map "";
        set $prompt_force_override "off";

        # ===================== AI-数据脱敏插件配置 =====================
        # 请求侧 / 响应侧脱敏开关（server 级配置，全 location 共享且自检接口可读）
        # on : 手机号 / 身份证正则脱敏；off: 插件完全不生效
        set $mask_enable_req "on";
        set $mask_enable_resp "on";

        # ===================== AI-可观测插件配置 =====================
        # 观测开关（server 级配置，自检接口可读）；off: 插件完全不生效
        set $observe_enable "on";
        # PushGateway 地址（含 job 路径）；空串 = 只打结构化日志不推送
        set $observe_pushgateway "http://127.0.0.1:9091/metrics/job/llm_gateway";
        # 推送节流间隔（秒）：高并发下多个请求共用一次推送，降低 PushGateway 压力
        set $observe_flush_interval "1";

        # 基础测试接口
        location /test_lua {
            default_type text/html;
            content_by_lua_block {
                ngx.log(ngx.INFO, "=== Lua环境运行成功 ===")
                ngx.say("OpenResty 1.25.3.2 运行正常！")
            }
        }

        # 你的AI插件测试接口
        location /ai/test {
            content_by_lua_block {
                local test_mod = require("test.test")
                test_mod.test()
            }
        }

        # ===================== AI-proxy 插件 =====================

        # 自检接口（模仿 test 插件）：检查 shared_dict/转换器/变量是否就绪
        location /ai/proxy_selftest {
            content_by_lua_block {
                require("ai_proxy.ai_proxy").test()
            }
        }

        # ===================== AI-token 限流插件 =====================

        # 限流插件自检：检查 resty.redis / Redis 连通性 / 当前限额配置
        location /ai/token_limit_selftest {
            content_by_lua_block {
                require("token_limit.token_limit").test()
            }
        }

        # 管理接口：写入网关 token 映射 / 覆盖路由表
        location /ai/proxy_admin {
            content_by_lua_block {
                require("ai_proxy.admin").run()
            }
        }

        # ===================== AI-配额管理插件 =====================

        # 配额插件自检：检查 resty.redis / Redis 连通性 / 当前策略配置
        location /ai/quota_selftest {
            content_by_lua_block {
                require("quota.quota").test()
            }
        }

        # 配额管理接口：查询 / 设置 / 增减 / 重置月度 token 额度
        #   GET  /ai/quota_admin?consumer_key=xxx
        #   POST /ai/quota_admin  body: {"consumer_key":"xxx","action":"set_quota|add|reset","value":123}
        location /ai/quota_admin {
            content_by_lua_block {
                require("quota.quota_admin_api").run()
            }
        }

        # ===================== AI-向量数据库缓存插件 =====================

        # 缓存插件自检：检查 resty.http / TEI embedding 连通+维度 / Milvus collection
        location /ai/vec_cache_selftest {
            content_by_lua_block {
                require("vec_cache.vec_cache").test()
            }
        }

        # 缓存管理接口：建表 / 删表 / 清空 / 统计 / 调试检索
        #   POST /ai/vec_cache_admin  body: {"action":"create_collection|drop_collection|clear|stats|search",...}
        location /ai/vec_cache_admin {
            content_by_lua_block {
                require("vec_cache.vec_cache_admin").run()
            }
        }

        # ===================== AI-提示词模板插件 =====================

        # 提示词模板插件自检：变量配置 / 映射解析 / 渲染示例
        location /ai/prompt_selftest {
            content_by_lua_block {
                require("prompt_template.prompt_template").test()
            }
        }

        # ===================== AI-数据脱敏插件 =====================

        # 脱敏插件自检：开关变量 / PCRE lookbehind 支持 / 正则自测样例
        location /ai/mask_selftest {
            content_by_lua_block {
                require("mask.mask").test()
            }
        }

        # ===================== AI-可观测插件 =====================

        # 可观测插件自检：开关变量 / shared dict / resty.http / PushGateway 连通性
        location /ai/observability_selftest {
            content_by_lua_block {
                require("observability.observability").test()
            }
        }

        # AI 网关统一入口：客户端永远只请求这个 OpenAI 标准路径
        location /v1/chat/completions {
            # 动态上游变量（access 阶段赋值，变量化 proxy_pass 的关键）
            set $ai_backend "";
            set $ai_request_uri "";

            proxy_buffering off;          # SSE 流式必须关缓冲
            proxy_http_version 1.1;       # 长连接流式
            proxy_set_header Connection "";
            proxy_set_header Accept-Encoding "";  # 禁止上游压缩，否则 body_filter 拿不到明文 SSE
            proxy_set_header Host $ai_backend;     # Host 跟随动态上游
            proxy_read_timeout 600s;      # 流式长响应，避免默认 60s 掐断
            proxy_send_timeout 600s;

            access_by_lua_block {
                -- 提示词模板：必须第一个执行（在 ai_proxy 解析 body / 协议转换
                -- 之前改写原始 OpenAI 请求体；放后面会覆盖 ernie 等已转换的上游格式）
                require("prompt_template.prompt_template").access()
                -- 数据脱敏：紧跟模板之后、ai_proxy 之前（对原始 OpenAI 请求体
                -- 脱敏，敏感信息不离开网关；放 ai_proxy 之后会基于已转换的上游
                -- 格式脱敏，且 vec_cache 的缓存 key / 入库 prompt 会拿到明文）
                require("mask.mask").access()
                -- 可观测：mask 之后、ai_proxy 之前（观测覆盖限流/配额拦截、
                -- 缓存命中、鉴权失败等全部分支；token 估算读脱敏后的 body）
                require("observability.observability").access()
                require("ai_proxy.ai_proxy").access()
                -- token 限流：必须跟在 ai_proxy 之后
                -- （复用 ctx.gateway_token / ctx.openai_req；lua-nginx-module
                --   每个阶段只允许一个 access_by_lua_block，需在同一 block 内链式调用）
                require("token_limit.token_limit").access()
                -- 向量缓存：限流之后、配额之前（命中缓存直接返回，不消耗月度额度）
                require("vec_cache.vec_cache").access()
                -- 月度配额：跟在限流/缓存之后（同样复用 gateway_token，同一 block 链式调用）
                require("quota.quota").access()
            }
            header_filter_by_lua_block {
                require("ai_proxy.ai_proxy").header_filter()
            }
            body_filter_by_lua_block {
                require("ai_proxy.ai_proxy").body_filter()
                -- 数据脱敏：紧跟 ai_proxy 之后（拿到 OpenAI 标准格式响应再脱敏），
                -- 下游限流/配额/缓存的旁路解析累积到的都是脱敏后的数据，
                -- 保证向量缓存入库的 answer 不含明文敏感信息
                require("mask.mask").body_filter()
                -- 限流旁路解析：只读扫描 usage，不改写响应
                require("token_limit.token_limit").body_filter()
                -- 配额旁路解析：同样只读扫描 usage，不改写响应
                require("quota.quota").body_filter()
                -- 向量缓存旁路累积：链尾只读拼 answer，绝不改写响应字节
                require("vec_cache.vec_cache").body_filter()
                -- 可观测：链尾旁路只读（分析 mask 重组后的标准 OpenAI 帧，
                -- 绝不改写 ngx.arg[1]，与 mask 的响应改写互不干扰）
                require("observability.observability").body_filter()
            }
            log_by_lua_block {
                require("token_limit.token_limit").log()
                require("quota.quota").log()
                -- 向量缓存异步写库：ngx.timer 回调里调 Milvus insert
                require("vec_cache.vec_cache").log()
                -- 可观测：shared dict 聚合 + 节流 timer 异步推 PushGateway
                require("observability.observability").log()
            }

            # 本地测试用 http mock；生产环境改为：
            #   proxy_pass https://$ai_backend$ai_request_uri;
            #   proxy_ssl_server_name on;   # HTTPS 上游 SNI 必需
            proxy_pass http://$ai_backend$ai_request_uri;
        }
    }
}
