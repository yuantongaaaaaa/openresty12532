worker_processes  1;
error_log  /home/cliondev/code/openresty12532/logs/error.log info;
pid        /home/cliondev/code/openresty12532/logs/nginx.pid;

# 必填的events块，解决no "events" section报错
events {
    worker_connections  1024;
}

http {
    default_type  application/octet-stream;
    access_log  /home/cliondev/code/openresty12532/logs/access.log;

    # 全部临时目录改到项目目录，解决权限问题
    client_body_temp_path  /home/cliondev/code/openresty12532/temp/client_body_temp;
    proxy_temp_path        /home/cliondev/code/openresty12532/temp/proxy_temp;
    fastcgi_temp_path      /home/cliondev/code/openresty12532/temp/fastcgi_temp;
    uwsgi_temp_path        /home/cliondev/code/openresty12532/temp/uwsgi_temp;
    scgi_temp_path         /home/cliondev/code/openresty12532/temp/scgi_temp;

    # Lua插件目录 + 开发模式关闭缓存
    lua_package_path "/home/cliondev/code/openresty12532/lua_plugins/?.lua;;";
    lua_code_cache off;

    # ===================== AI-proxy 插件共享内存 =====================
    # 网关 token -> 4家厂商密钥映射表
    lua_shared_dict ai_gateway_token_dict 10m;
    # 文心 AK/SK 换取 access_token 的 TTL 缓存
    lua_shared_dict ai_ernie_token_dict 1m;
    # 路由表覆盖（测试时可指向 mock 地址）
    lua_shared_dict ai_proxy_routes_dict 1m;

    # 变量化 proxy_pass 需要运行时 DNS 解析
    resolver 223.5.5.5 8.8.8.8 ipv6=off;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       8080;
        server_name  localhost;

        # 基础测试接口
        location /test_lua {
            default_type text/html;
            content_by_lua_block {
                ngx.log(ngx.INFO, "=== Lua环境运行成功 ===")
                ngx.say("OpenResty 1.25.3.2 运行正常！")
            }
        }

        # 你的AI插件测试接口
        location /ai/test {
            content_by_lua_block {
                local test_mod = require("test.test")
                test_mod.test()
            }
        }

        # ===================== AI-proxy 插件 =====================

        # 自检接口（模仿 test 插件）：检查 shared_dict/转换器/变量是否就绪
        location /ai/proxy_selftest {
            content_by_lua_block {
                require("ai_proxy.ai_proxy").test()
            }
        }

        # ===================== AI-token 限流插件 =====================

        # 限流插件自检：检查 resty.redis / Redis 连通性 / 当前限额配置
        location /ai/token_limit_selftest {
            content_by_lua_block {
                require("token_limit.token_limit").test()
            }
        }

        # 管理接口：写入网关 token 映射 / 覆盖路由表
        location /ai/proxy_admin {
            content_by_lua_block {
                require("ai_proxy.admin").run()
            }
        }

        # AI 网关统一入口：客户端永远只请求这个 OpenAI 标准路径
        location /v1/chat/completions {
            # 动态上游变量（access 阶段赋值，变量化 proxy_pass 的关键）
            set $ai_backend "";
            set $ai_request_uri "";

            proxy_buffering off;          # SSE 流式必须关缓冲
            proxy_http_version 1.1;       # 长连接流式
            proxy_set_header Connection "";
            proxy_set_header Accept-Encoding "";  # 禁止上游压缩，否则 body_filter 拿不到明文 SSE
            proxy_set_header Host $ai_backend;     # Host 跟随动态上游
            proxy_read_timeout 600s;      # 流式长响应，避免默认 60s 掐断
            proxy_send_timeout 600s;

            access_by_lua_block {
                require("ai_proxy.ai_proxy").access()
                -- token 限流：必须跟在 ai_proxy 之后
                -- （复用 ctx.gateway_token / ctx.openai_req；lua-nginx-module
                --   每个阶段只允许一个 access_by_lua_block，需在同一 block 内链式调用）
                require("token_limit.token_limit").access()
            }
            header_filter_by_lua_block {
                require("ai_proxy.ai_proxy").header_filter()
            }
            body_filter_by_lua_block {
                require("ai_proxy.ai_proxy").body_filter()
                -- 限流旁路解析：只读扫描 usage，不改写响应
                require("token_limit.token_limit").body_filter()
            }
            log_by_lua_block {
                require("token_limit.token_limit").log()
            }

            # 本地测试用 http mock；生产环境改为：
            #   proxy_pass https://$ai_backend$ai_request_uri;
            #   proxy_ssl_server_name on;   # HTTPS 上游 SNI 必需
            proxy_pass http://$ai_backend$ai_request_uri;
        }
    }
}
